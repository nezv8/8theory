Không và Hiện Hữu.\n            </p>\n        </div>\n    </aside>\n\n    <!-- Info & Philosophical Modal -->\n    <div id=\"info-modal\" class=\"fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300\">\n        <div class=\"glass-panel max-w-2xl w-full max-h-[85vh] rounded-3xl p-6 lg:p-8 overflow-y-auto space-y-6 border border-cosmic-gold/30 shadow-2xl relative\">\n            <button onclick=\"toggleInfoModal()\" class=\"absolute top-6 right-6 text-slate-400 hover:text-white\">\n                <i data-lucide=\"x\" class=\"w-6 h-6\"></i>\n            </button>\n\n            <div class=\"space-y-2\">\n                <span class=\"text-xs uppercase font-mono text-cosmic-gold tracking-widest\">Triết Học Hợp Nhất</span>\n                <h3 class=\"font-serif text-2xl font-bold text-white bg-gradient-to-r from-cosmic-gold via-white to-cosmic-cyan bg-clip-text text-transparent\">\n                    Sacred Geometry, Walter Russell & Đạo Phật\n                </h3>\n            </div>\n\n            <div class=\"space-y-4 text-sm text-slate-300 leading-relaxed\">\n                <div class=\"bg-cosmic-900/60 p-4 rounded-2xl border border-white/5 space-y-2\">\n                    <h4 class=\"font-serif font-bold text-cosmic-gold flex items-center gap-2\">\n                        <i data-lucide=\"sun\" class=\"w-4 h-4\"></i> The Message of the Divine Iliad (Walter Russell)\n                    </h4>\n                    <p class=\"text-xs\">\n                        Vũ trụ là một chuỗi sóng tư duy chuyển động không ngừng giữa hai cực: <strong>Compression (Nén - Dương)</strong> và <strong>Expansion (Giãn - Âm)</strong>. Ở trung tâm của mọi chuyển động là một <em>Still Point (Điểm Tĩnh Lặng)</em> - biểu tượng của Ánh Sáng Tuyệt Đối và Tâm Thức Vũ Trụ.\n                    </p>\n                </div>\n\n                <div class=\"bg-cosmic-900/60 p-4 rounded-2xl border border-white/5 space-y-2\">\n                    <h4 class=\"font-serif font-bold text-cosmic-cyan flex items-center gap-2\">\n                        <i data-lucide=\"circle-dot\" class=\"w-4 h-4\"></i> Phật Giáo (Tánh Không & Trung Đạo)\n                    </h4>\n                    <p class=\"text-xs\">\n                        Hình học thiêng liêng biểu thị mạng lưới <strong>Duyên Khởi (Dependent Origination)</strong> - mọi đỉnh và cạnh liên kết phụ thuộc lẫn nhau. Bản chất của mọi hình khối là <strong>Tánh Không (Śūnyatā)</strong>: sinh khởi từ Chân Không, vận hành qua Trung Đạo và trở về Tĩnh Lặng.\n                    </p>\n                </div>\n\n                <div class=\"space-y-2 pt-2\">\n                    <h4 class=\"font-serif font-bold text-white text-xs uppercase tracking-wider\">Ý Nghĩa Các Khối Hình Học:</h4>\n                    <ul class=\"grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs\">\n                        <li class=\"bg-white/5 p-2.5 rounded-xl border border-white/5\"><strong>Merkaba:</strong> Cực tính Âm-Dương xoay quanh Tâm Tĩnh Lặng.</li>\n                        <li class=\"bg-white/5 p-2.5 rounded-xl border border-white/5\"><strong>Flower of Life:</strong> Mạng lưới Duyên Khởi kết nối vạn vật.</li>\n                        <li class=\"bg-white/5 p-2.5 rounded-xl border border-white/5\"><strong>Metatron's Cube:</strong> Khung mẫu tạo hóa của 5 khối Platonic.</li>\n                        <li class=\"bg-white/5 p-2.5 rounded-xl border border-white/5\"><strong>Vesica Piscis:</strong> Nhị diện giao thoa tạo ra Ánh Sáng.</li>\n                    </ul>\n                </div>\n            </div>\n\n            <button onclick=\"toggleInfoModal()\" class=\"w-full py-3 rounded-2xl bg-gradient-to-r from-cosmic-gold to-cosmic-cyan text-cosmic-950 font-bold text-sm hover:opacity-95 transition-all\">\n                Đã Hiểu & Tiếp Tục Trải Nghiệm\n            </button>\n        </div>\n    </div>\n\n    <!-- Bottom Center Interaction Cue -->\n    <div class=\"absolute bottom-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none text-center hidden md:block\">\n        <p class=\"text-[11px] text-slate-400/80 bg-cosmic-950/60 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-md\">\n            ✨ Xoay bằng chuột / Vuốt màn hình • Cuộn để phóng to/thu nhỏ\n        </p>\n    </div>\n\n    <!-- JavaScript Application Core Logic -->\n    <script>\n        // Initialize Lucide Icons\n        lucide.createIcons();\n\n        // Preset Information Data\n        const PRESETS = {\n            merkaba: {\n                title: \"Merkaba (Star Tetrahedron)\",\n                desc: \"Biểu tượng kết hợp hai khối Tứ diện đối lập đại diện cho cực tính Âm-Dương (Light/Shadow, Compression/Expansion) quay quanh Điểm Tĩnh Lặng (Central Void). Trong Phật giáo, đây là sự dung hợp Trung Đạo giữa Tánh Không và Hiện Hữu.\"\n            },\n            flowerOfLife: {\n                title: \"Flower of Life Grid\",\n                desc: \"Mạng lưới hình học thiêng liêng cấu thành từ các hình tròn đan xen, minh họa hoàn hảo cho triết lý Duyên Khởi (Interconnectedness). Mỗi nút giao là một thực thể sinh khởi trong mối quan hệ hữu cơ với toàn thể vũ trụ.\"\n            },\n            metatron: {\n                title: \"Metatron's Cube\",\n                desc: \"Chứa đựng toàn bộ 5 khối Platonic, Metatron's Cube đại diện cho bản thiết kế tạo hóa của Sóng Tư Duy (Walter Russell). Mọi dạng vật chất đều biến thiên từ khung cấu trúc hình học thiêng liêng này.\"\n            },\n            platonic: {\n                title: \"Platonic Solids Morphing\",\n                desc: \"Sự chuyển hóa nhịp nhàng giữa 5 khối đa diện đều (Tứ diện, Lập phương, Bát diện, Thập nhị diện, Nhị thập diện) tượng trưng cho sự luân chuyển của 5 đại (Địa, Thủy, Hỏa, Phong, Không) trong triết học Phật giáo.\"\n            },\n            vesica: {\n                title: \"Vesica Piscis Light Waves\",\n                desc: \"Giao điểm của hai hình cầu Ánh Sáng ban sơ, biểu thị cho sát-na khởi tạo vật chất và nhận thức. Nhịp sóng lan tỏa đại diện cho sự phóng chiếu từ Tâm Tĩnh Lặng ra thế giới hiện tượng.\"\n            }\n        };\n\n        // UI Logic Toggles — trạng thái khởi tạo khớp với bố cục desktop/mobile.\n        const controlPanel = document.getElementById('control-panel');\n        const desktopPanelQuery = window.matchMedia('(min-width: 768px)');\n        let panelOpen = desktopPanelQuery.matches;\n\n        function setControlPanelOpen(open) {\n            if (!controlPanel) return;\n            panelOpen = Boolean(open);\n            controlPanel.classList.toggle('panel-open', panelOpen);\n            controlPanel.classList.toggle('panel-closed', !panelOpen);\n            controlPanel.setAttribute('aria-hidden', String(!panelOpen));\n        }\n\n        function toggleControlPanel() {\n            setControlPanelOpen(!panelOpen);\n        }\n\n        // Đặt trạng thái ngay từ lần render đầu để popup không nháy rồi tự ẩn.\n        setControlPanelOpen(panelOpen);\n        if (desktopPanelQuery.addEventListener) {\n            desktopPanelQuery.addEventListener('change', event => setControlPanelOpen(event.matches));\n        } else if (desktopPanelQuery.addListener) {\n            desktopPanelQuery.addListener(event => setControlPanelOpen(event.matches));\n        }\n\n        function toggleInfoModal() {\n            const modal = document.getElementById('info-modal');\n            if (modal.classList.contains('hidden')) {\n                modal.classList.remove('hidden');\n                setTimeout(() => {\n                    modal.classList.remove('opacity-0');\n                }, 10);\n            } else {\n                modal.classList.add('opacity-0');\n                setTimeout(() => {\n                    modal.classList.add('hidden');\n                }, 300);\n            }\n        }\n\n        // --- THREE.JS SCENE SETUP ---\n        const container = document.getElementById('webgl-container');\n        let scene, camera, renderer, controls;\n        let mainGroup, particleSystem, stillnessPointMesh;\n\n        // Simulation parameters\n        let currentPreset = 'merkaba';\n        let speedMult = 1.0;\n        let complexityMult = 1.0;\n        let colorSchemeIndex = 0; // 0: Gold, 1: Cyan, 2: Violet, 3: Rainbow Spectrum\n        let showStillness = true;\n        let showParticles = true;\n\n        // Color Palettes\n        const COLOR_PALETTES = [\n            { primary: 0xffd700, secondary: 0xffa500, glow: 0xfff3a8, name: \"Cosmic Gold\" },\n            { primary: 0x00f3ff, secondary: 0x0077ff, glow: 0x80f9ff, name: \"Cyan Void\" },\n            { primary: 0xa855f7, secondary: 0xff007f, glow: 0xe9d5ff, name: \"Violet Buddha\" },\n            { primary: 0xffd700, secondary: 0x00f3ff, glow: 0xa855f7, name: \"Rainbow Aura\" }\n        ];\n\n        function initThree() {\n            // Scene\n            scene = new THREE.Scene();\n            scene.fog = new THREE.FogExp2(0x020208, 0.012);\n\n            // Camera\n            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);\n            camera.position.set(0, 0, 35);\n\n            // Renderer\n            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });\n            renderer.setSize(window.innerWidth, window.innerHeight);\n            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n            renderer.toneMapping = THREE.ACESFilmicToneMapping;\n            container.appendChild(renderer.domElement);\n\n            // Orbit Controls\n            controls = new THREE.OrbitControls(camera, renderer.domElement);\n            controls.enableDamping = true;\n            controls.dampingFactor = 0.05;\n            controls.rotateSpeed = 0.8;\n            controls.maxDistance = 100;\n            controls.minDistance = 5;\n\n            // Lights\n            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);\n            scene.add(ambientLight);\n\n            const pointLight1 = new THREE.PointLight(0xffd700, 2, 50);\n            pointLight1.position.set(10, 15, 10);\n            scene.add(pointLight1);\n\n            const pointLight2 = new THREE.PointLight(0x00f3ff, 2, 50);\n            pointLight2.position.set(-10, -15, -10);\n            scene.add(pointLight2);\n\n            // Main Geometry Group\n            mainGroup = new THREE.Group();\n            scene.add(mainGroup);\n\n            // Build Initial Objects\n            createStillnessPoint();\n            createParticles();\n            buildGeometry(currentPreset);\n\n            // Event Listeners\n            window.addEventListener('resize', onWindowResize);\n            setupUIEventListeners();\n\n            // Start Animation Loop\n            animate();\n        }\n\n        // --- STILLNESS POINT (CENTRAL VOID / CHÂN KHÔNG) ---\n        function createStillnessPoint() {\n            if (stillnessPointMesh) scene.remove(stillnessPointMesh);\n\n            const group = new THREE.Group();\n\n            // Core glowing sphere\n            const geo = new THREE.SphereGeometry(0.8, 32, 32);\n            const mat = new THREE.MeshBasicMaterial({\n                color: 0xffffff,\n                wireframe: false\n            });\n            const core = new THREE.Mesh(geo, mat);\n            group.add(core);\n\n            // Axis vectors representing central stillness\n            const axisGeo = new THREE.BufferGeometry();\n            const axisCoords = [\n                -3,0,0, 3,0,0,\n                0,-3,0, 0,3,0,\n                0,0,-3, 0,0,3\n            ];\n            axisGeo.setAttribute('position', new THREE.Float32BufferAttribute(axisCoords, 3));\n            const axisMat = new THREE.LineBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.5 });\n            const axes = new THREE.LineSegments(axisGeo, axisMat);\n            group.add(axes);\n\n            stillnessPointMesh = group;\n            stillnessPointMesh.visible = showStillness;\n            scene.add(stillnessPointMesh);\n        }\n\n        // --- MIND DUST / COSMIC PARTICLES ---\n        function createParticles() {\n            if (particleSystem) scene.remove(particleSystem);\n\n            const count = 1200;\n            const geometry = new THREE.BufferGeometry();\n            const positions = new Float32Array(count * 3);\n            const colors = new Float32Array(count * 3);\n\n            const palette = COLOR_PALETTES[colorSchemeIndex];\n            const c1 = new THREE.Color(palette.primary);\n            const c2 = new THREE.Color(palette.secondary);\n\n            for (let i = 0; i < count; i++) {\n                const r = (Math.random() * 40) + 5;\n                const theta = Math.random() * Math.PI * 2;\n                const phi = Math.acos((Math.random() * 2) - 1);\n\n                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);\n                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);\n                positions[i * 3 + 2] = r * Math.cos(phi);\n\n                const mixedColor = c1.clone().lerp(c2, Math.random());\n                colors[i * 3] = mixedColor.r;\n                colors[i * 3 + 1] = mixedColor.g;\n                colors[i * 3 + 2] = mixedColor.b;\n            }\n\n            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));\n\n            const material = new THREE.PointsMaterial({\n                size: 0.25,\n                vertexColors: true,\n                transparent: true,\n                opacity: 0.6,\n                blending: THREE.AdditiveBlending\n            });\n\n            particleSystem = new THREE.Points(geometry, material);\n            particleSystem.visible = showParticles;\n            scene.add(particleSystem);\n        }\n\n        // --- GEOMETRY BUILDERS ---\n        function clearMainGroup() {\n            while (mainGroup.children.length > 0) {\n                const obj = mainGroup.children[0];\n                if (obj.geometry) obj.geometry.dispose();\n                if (obj.material) {\n                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());\n                    else obj.material.dispose();\n                }\n                mainGroup.remove(obj);\n            }\n        }\n\n        function buildGeometry(preset) {\n            clearMainGroup();\n            const palette = COLOR_PALETTES[colorSchemeIndex];\n\n            switch (preset) {\n                case 'merkaba':\n                    buildMerkaba(palette);\n                    break;\n                case 'flowerOfLife':\n                    buildFlowerOfLife(palette);\n                    break;\n                case 'metatron':\n                    buildMetatronCube(palette);\n                    break;\n                case 'platonic':\n                    buildPlatonicMorph(palette);\n                    break;\n                case 'vesica':\n                    buildVesicaPiscis(palette);\n                    break;\n            }\n        }\n\n        // 1. MERKABA BUILDER\n        function buildMerkaba(palette) {\n            const size = 6 * complexityMult;\n\n            // Male Tetrahedron (Pointing Up)\n            const geoUp = new THREE.TetrahedronGeometry(size);\n            const matUp = new THREE.MeshStandardMaterial({\n                color: palette.primary,\n                wireframe: true,\n                emissive: palette.primary,\n                emissiveIntensity: 0.3,\n                roughness: 0.2\n            });\n            const meshUp = new THREE.Mesh(geoUp, matUp);\n\n            // Female Tetrahedron (Pointing Down)\n            const geoDown = new THREE.TetrahedronGeometry(size);\n            geoDown.rotateX(Math.PI);\n            const matDown = new THREE.MeshStandardMaterial({\n                color: palette.secondary,\n                wireframe: true,\n                emissive: palette.secondary,\n                emissiveIntensity: 0.3,\n                roughness: 0.2\n            });\n            const meshDown = new THREE.Mesh(geoDown, matDown);\n\n            const group = new THREE.Group();\n            group.add(meshUp);\n            group.add(meshDown);\n\n            // Inner Solid Glass Core\n            const coreGeo = new THREE.OctahedronGeometry(size * 0.4);\n            const coreMat = new THREE.MeshPhysicalMaterial({\n                color: 0xffffff,\n                transmission: 0.9,\n                opacity: 1,\n                transparent: true,\n                roughness: 0,\n                ior: 1.5\n            });\n            group.add(new THREE.Mesh(coreGeo, coreMat));\n\n            mainGroup.add(group);\n        }\n\n        // 2. FLOWER OF LIFE BUILDER\n        function buildFlowerOfLife(palette) {\n            const group = new THREE.Group();\n            const radius = 2.5;\n            const layers = Math.floor(2 * complexityMult);\n\n            const mat = new THREE.LineBasicMaterial({\n                color: palette.primary,\n                transparent: true,\n                opacity: 0.7\n            });\n\n            // Central circle\n            const createCircle = (x, y, z) => {\n                const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, 2 * Math.PI, false, 0);\n                const points = curve.getPoints(48);\n                const geo = new THREE.BufferGeometry().setFromPoints(points);\n                const line = new THREE.Line(geo, mat);\n                line.position.set(x, y, z);\n                return line;\n            };\n\n            group.add(createCircle(0, 0, 0));\n\n            // Hexagonal Ring Generation\n            for (let l = 1; l <= layers + 1; l++) {\n                for (let i = 0; i < 6; i++) {\n                    const angle = (i * Math.PI) / 3;\n                    const x = Math.cos(angle) * radius * l;\n                    const y = Math.sin(angle) * radius * l;\n                    group.add(createCircle(x, y, 0));\n                    group.add(createCircle(x, y, radius * 0.5));\n                    group.add(createCircle(x, y, -radius * 0.5));\n                }\n            }\n\n            mainGroup.add(group);\n        }\n\n        // 3. METATRON'S CUBE BUILDER\n        function buildMetatronCube(palette) {\n            const group = new THREE.Group();\n            const radius = 5 * complexityMult;\n            const nodePositions = [];\n\n            // Center\n            nodePositions.push(new THREE.Vector3(0, 0, 0));\n\n            // Inner 6 nodes\n            for (let i = 0; i < 6; i++) {\n                const angle = (i * Math.PI) / 3;\n                nodePositions.push(new THREE.Vector3(Math.cos(angle) * radius * 0.5, Math.sin(angle) * radius * 0.5, 0));\n            }\n            // Outer 6 nodes\n            for (let i = 0; i < 6; i++) {\n                const angle = (i * Math.PI) / 3;\n                nodePositions.push(new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, 0));\n            }\n\n            // Node Spheres\n            const nodeGeo = new THREE.SphereGeometry(0.3, 16, 16);\n            const nodeMat = new THREE.MeshStandardMaterial({ color: palette.glow, emissive: palette.primary });\n\n            nodePositions.forEach(pos => {\n                const mesh = new THREE.Mesh(nodeGeo, nodeMat);\n                mesh.position.copy(pos);\n                group.add(mesh);\n            });\n\n            // Connect every node to every other node (Interconnectedness / Duyên Khởi)\n            const linePositions = [];\n            for (let i = 0; i < nodePositions.length; i++) {\n                for (let j = i + 1; j < nodePositions.length; j++) {\n                    linePositions.push(nodePositions[i].x, nodePositions[i].y, nodePositions[i].z);\n                    linePositions.push(nodePositions[j].x, nodePositions[j].y, nodePositions[j].z);\n                }\n            }\n\n            const lineGeo = new THREE.BufferGeometry();\n            lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));\n            const lineMat = new THREE.LineBasicMaterial({ color: palette.primary, transparent: true, opacity: 0.4 });\n            const lines = new THREE.LineSegments(lineGeo, lineMat);\n\n            group.add(lines);\n            mainGroup.add(group);\n        }\n\n        // 4. PLATONIC SOLIDS MORPH BUILDER\n        function buildPlatonicMorph(palette) {\n            const group = new THREE.Group();\n            const size = 5 * complexityMult;\n\n            const geometries = [\n                new THREE.TetrahedronGeometry(size),\n                new THREE.BoxGeometry(size, size, size),\n                new THREE.OctahedronGeometry(size),\n                new THREE.DodecahedronGeometry(size),\n                new THREE.IcosahedronGeometry(size)\n            ];\n\n            geometries.forEach((geo, idx) => {\n                const mat = new THREE.MeshStandardMaterial({\n                    color: idx % 2 === 0 ? palette.primary : palette.secondary,\n                    wireframe: true,\n                    transparent: true,\n                    opacity: 0.5\n                });\n                const mesh = new THREE.Mesh(geo, mat);\n                mesh.scale.setScalar(0.4 + idx * 0.25);\n                group.add(mesh);\n            });\n\n            mainGroup.add(group);\n        }\n\n        // 5. VESICA PISCIS BUILDER\n        function buildVesicaPiscis(palette) {\n            const group = new THREE.Group();\n            const radius = 6 * complexityMult;\n\n            const mat1 = new THREE.MeshStandardMaterial({\n                color: palette.primary,\n                wireframe: true,\n                transparent: true,\n                opacity: 0.5\n            });\n            const mat2 = new THREE.MeshStandardMaterial({\n                color: palette.secondary,\n                wireframe: true,\n                transparent: true,\n                opacity: 0.5\n            });\n\n            const sphere1 = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 24), mat1);\n            sphere1.position.x = -radius * 0.5;\n\n            const sphere2 = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 24), mat2);\n            sphere2.position.x = radius * 0.5;\n\n            group.add(sphere1);\n            group.add(sphere2);\n\n            mainGroup.add(group);\n        }\n\n\n        // --- ANIMATION & TIME LOOP ---\n        let clock = new THREE.Clock();\n\n        function animate() {\n            requestAnimationFrame(animate);\n\n            const delta = clock.getDelta();\n            const elapsedTime = clock.getElapsedTime() * speedMult;\n\n            // 1. Rotate Main Geometry Group (Balanced Interchange)\n            if (mainGroup) {\n                mainGroup.rotation.y = elapsedTime * 0.2;\n                mainGroup.rotation.x = Math.sin(elapsedTime * 0.1) * 0.15;\n\n                // Pulsing Breathing Effect (Compression & Expansion)\n                if (currentPreset === 'merkaba') {\n                    const child1 = mainGroup.children[0]?.children[0];\n                    const child2 = mainGroup.children[0]?.children[1];\n                    if (child1 && child2) {\n                        child1.rotation.y = elapsedTime * 0.5;\n                        child2.rotation.y = -elapsedTime * 0.5;\n                    }\n                }\n\n                // Breathing Scale\n                const breathScale = 1 + Math.sin(elapsedTime * 1.5) * 0.08;\n                mainGroup.scale.set(breathScale, breathScale, breathScale);\n            }\n\n            // 2. Animate Particles\n            if (particleSystem && particleSystem.visible) {\n                particleSystem.rotation.y = -elapsedTime * 0.05;\n            }\n\n            // 3. Pulse Stillness Core\n            if (stillnessPointMesh && stillnessPointMesh.visible) {\n                const core = stillnessPointMesh.children[0];\n                if (core) {\n                    const pulse = 0.8 + Math.sin(elapsedTime * 3) * 0.15;\n                    core.scale.set(pulse, pulse, pulse);\n                }\n            }\n\n            controls.update();\n            renderer.render(scene, camera);\n        }\n\n\n        // --- UI & EVENT LISTENERS ---\n        function setupUIEventListeners() {\n            // Slider 1: Speed\n            document.getElementById('slider-speed').addEventListener('input', (e) => {\n                speedMult = parseFloat(e.target.value);\n                document.getElementById('val-speed').innerText = speedMult.toFixed(1) + 'x';\n            });\n\n            // Slider 2: Complexity\n            document.getElementById('slider-complexity').addEventListener('input', (e) => {\n                complexityMult = parseFloat(e.target.value);\n                document.getElementById('val-complexity').innerText = complexityMult.toFixed(1);\n                buildGeometry(currentPreset);\n            });\n\n            // Slider 3: Color Spectrum\n            document.getElementById('slider-color').addEventListener('input', (e) => {\n                colorSchemeIndex = parseInt(e.target.value);\n                const palette = COLOR_PALETTES[colorSchemeIndex];\n                document.getElementById('val-color').innerText = palette.name;\n                buildGeometry(currentPreset);\n                createParticles();\n            });\n\n            // Toggle Stillness\n            document.getElementById('toggle-stillness').addEventListener('change', (e) => {\n                showStillness = e.target.checked;\n                if (stillnessPointMesh) stillnessPointMesh.visible = showStillness;\n            });\n\n            // Toggle Particles\n            document.getElementById('toggle-particles').addEventListener('change', (e) => {\n                showParticles = e.target.checked;\n                if (particleSystem) particleSystem.visible = showParticles;\n            });\n        }\n\n        function setPreset(preset) {\n            currentPreset = preset;\n            document.querySelectorAll('.preset-btn').forEach(btn => {\n                btn.classList.remove('border-cosmic-gold/40', 'bg-cosmic-gold/10', 'text-cosmic-gold');\n                btn.classList.add('border-white/10', 'bg-white/5', 'text-slate-300');\n            });\n\n            const activeBtn = document.getElementById(`preset-${preset}`);\n            if (activeBtn) {\n                activeBtn.classList.remove('border-white/10', 'bg-white/5', 'text-slate-300');\n                activeBtn.classList.add('border-cosmic-gold/40', 'bg-cosmic-gold/10', 'text-cosmic-gold');\n            }\n\n            // Update Philosophy Insight Card\n            const info = PRESETS[preset];\n            if (info) {\n                document.getElementById('card-title').innerText = info.title;\n                document.getElementById('card-desc').innerText = info.desc;\n            }\n\n            buildGeometry(preset);\n        }\n\n        function resetCamera() {\n            camera.position.set(0, 0, 35);\n            controls.target.set(0, 0, 0);\n            controls.update();\n        }\n\n        function onWindowResize() {\n            camera.aspect = window.innerWidth / window.innerHeight;\n            camera.updateProjectionMatrix();\n            renderer.setSize(window.innerWidth, window.innerHeight);\n        }\n\n        // --- SCREENSHOT FUNCTIONALITY ---\n        function takeScreenshot() {\n            renderer.render(scene, camera);\n            const dataURL = renderer.domElement.toDataURL('image/png');\n            const link = document.createElement('a');\n            link.download = `sacred-geometry-${currentPreset}.png`;\n            link.href = dataURL;\n            link.click();\n        }\n        // Shared MP3 audio is controlled by the parent fly player.\n\n\n\n        // Initialize App on DOM Load\n        window.onload = () => {\n            initThree();\n        };\n    <\/script>\n</body>\n</html>"
};
(() => {
  const frame = document.getElementById('simulation-frame');
  const tabs = Array.from(document.querySelectorAll('.tab[data-view]'));
  let activeView = '';
  const titles = {
    topology: ['Mô phỏng Topo & Bát Chánh Đạo', 'Topo & Bát Chánh Đạo | Vũ Trụ Hợp Nhất'],
    light: ['Mô phỏng Ánh Sáng và Tánh Không', 'Ánh Sáng & Tánh Không | Vũ Trụ Hợp Nhất'],
    geometry: ['Mô phỏng Hình Học Thiêng Liêng', 'Hình Học Thiêng Liêng | Vũ Trụ Hợp Nhất']
  };
  function showSimulation(view) {
    if (!Object.prototype.hasOwnProperty.call(apps, view)) return;
    tabs.forEach(tab => {
      const selected = tab.dataset.view === view;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
    });
    if (activeView !== view) {
      frame.title = titles[view][0];
      frame.srcdoc = apps[view];
      activeView = view;
      document.title = titles[view][1];
    }
  }
  tabs.forEach(tab => {
    tab.addEventListener('click', () => showSimulation(tab.dataset.view));
    tab.addEventListener('keydown', event => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      const currentIndex = tabs.indexOf(tab);
      const nextIndex = (currentIndex + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      tabs[nextIndex].focus();
      showSimulation(tabs[nextIndex].dataset.view);
    });
  });
  showSimulation('topology');
})();

// Shared MP3 fly player. Attempt autoplay on load, and retry on first user interaction if blocked.
(() => {
  const audio = document.getElementById('bgAudio');
  const player = document.getElementById('flyMusicPlayer');
  const button = document.getElementById('btnToggleMusic');
  const disc = document.getElementById('musicIconWrapper');
  const status = document.getElementById('musicStatusText');
  const icon = document.getElementById('playPauseIcon');
  let userPaused = false;
  let playPromise = null;
  audio.volume = 0.32;

  function render(isPlaying, message) {
    button.textContent = isPlaying ? 'Dừng' : 'Phát';
    button.setAttribute('aria-pressed', String(isPlaying));
    disc.setAttribute('aria-label', isPlaying ? 'Tạm dừng nhạc nền' : 'Phát nhạc nền');
    disc.classList.toggle('animate-spin-slow', isPlaying);
    status.textContent = message || (isPlaying ? 'Đang phát nhạc nền' : 'Đã tạm dừng');
    icon.innerHTML = isPlaying
      ? '<path d="M8 6h3v12H8zM14 6h3v12h-3z" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="10" stroke="currentColor"/>'
      : '<path d="M9 6v12l10-6z" fill="currentColor" stroke="none"/>';
  }
  function startMusic() {
    if (!audio.paused) { render(true); return Promise.resolve(true); }
    if (playPromise) return playPromise;
    playPromise = audio.play().then(() => {
      userPaused = false;
      render(true, 'Đang phát nhạc nền');
      return true;
    }).catch(() => {
      render(false, 'Trình duyệt chặn tự phát — nhấn Phát để bật nhạc');
      return false;
    }).finally(() => { playPromise = null; });
    return playPromise;
  }
  function toggleMusic() {
    if (audio.paused) {
      userPaused = false;
      startMusic();
    } else {
      userPaused = true;
      audio.pause();
      render(false, 'Đã tạm dừng nhạc');
    }
  }
  button.addEventListener('click', toggleMusic);
  disc.addEventListener('click', toggleMusic);
  disc.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleMusic(); }
  });
  audio.addEventListener('playing', () => render(true, 'Đang phát nhạc nền'));
  audio.addEventListener('pause', () => { if (userPaused) render(false, 'Đã tạm dừng nhạc'); });
  audio.addEventListener('error', () => render(false, 'Không tải được MP3 — kiểm tra ./mp3/universal-path.mp3'));

  // Tự phát khi người dùng click/chạm ở bất kỳ đâu trong trang hoặc bên trong mô phỏng.
  // Bỏ qua click của fly player để nút Dừng không bị bật nhạc lại ngay lập tức.
  function startFromGesture(event) {
    if (event && event.target && player.contains(event.target)) return;
    if (audio.paused) {
      userPaused = false;
      startMusic();
    }
  }
  document.addEventListener('click', startFromGesture);
  document.addEventListener('keydown', startFromGesture);

  // Click trong iframe không nổi bọt ra trang cha, nên cần gắn listener riêng.
  const simulationFrame = document.getElementById('simulation-frame');
  function bindSimulationGestures() {
    try {
      const frameDoc = simulationFrame && simulationFrame.contentDocument;
      if (!frameDoc || frameDoc.__sharedMusicGestureBound) return;
      frameDoc.__sharedMusicGestureBound = true;
      frameDoc.addEventListener('click', () => {
        if (audio.paused) {
          userPaused = false;
          startMusic();
        }
      });
      frameDoc.addEventListener('keydown', () => {
        if (audio.paused) {
          userPaused = false;
          startMusic();
        }
      });
    } catch (error) {
      // Không làm gián đoạn mô phỏng nếu trình duyệt không cho truy cập iframe.
    }
  }
  if (simulationFrame) {
    simulationFrame.addEventListener('load', bindSimulationGestures);
    bindSimulationGestures();
  }

  startMusic();
})();
</script>
</body>
</html>
